name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://127.0.0.1:1
      DB_NAME: ci
      JWT_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: x
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: yarn, cache-dependency-path: frontend/yarn.lock }
      - run: cd frontend && yarn install --frozen-lockfile && CI=false yarn build

  install:
    # Runs the real one-command installer on a fresh Ubuntu runner, then checks the live site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deploy/install.sh (non-interactive)
        run: sudo env DOMAIN=localhost ADMIN_EMAIL=admin@example.org ADMIN_PASSWORD='Ci-Strong-Passw0rd!x' bash deploy/install.sh < /dev/null
      - name: Check the running site
        run: |
          for i in $(seq 1 40); do
            s=$(sudo docker inspect -f '{{.State.Health.Status}}' "$(sudo docker compose ps -q backend)" 2>/dev/null || true)
            [ "$s" = healthy ] && break; sleep 5
          done
          sudo docker compose ps
          curl -skf --retry 10 --retry-delay 3 --retry-all-errors https://localhost/api/health
          curl -skf https://localhost/ | grep -q "<title>Vantage BTC</title>"
          curl -skI https://localhost/ | grep -i "content-security-policy"
          code=$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/auth/login -H 'Content-Type: application/json' -H 'Origin: https://localhost' -d '{"email":"admin@example.org","password":"Ci-Strong-Passw0rd!x"}')
          echo "login: $code"; [ "$code" = 200 ]
          test -f /etc/cron.d/vantage-btc && test -f /etc/cron.d/vantage-auto-update && sudo bash deploy/backup.sh && sudo ls -la /opt/vantage-backups
          echo "installer OK"
      - if: always()
        run: sudo docker compose logs --tail 60 backend web || true
