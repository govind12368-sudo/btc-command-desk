# Manual: Actions → Screenshots → Run workflow. Starts the full stack with live market data on a
# GitHub runner and uploads screenshots of the main pages as an artifact.
name: Screenshots
on: workflow_dispatch
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Ci-Strong-Passw0rd!x
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i "s/^DOMAIN=.*/DOMAIN=localhost/; s/^ADMIN_EMAIL=.*/ADMIN_EMAIL=$ADMIN_EMAIL/; s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$ADMIN_PASSWORD/; s/^JWT_SECRET=.*/JWT_SECRET=ci0123456789abcdefghijklmnopqrstuvwxyzABCDEFGH/" .env
          docker compose up -d --build mongo backend web
          curl -skf --retry 20 --retry-delay 3 --retry-all-errors https://localhost/api/health
          sleep 120   # let candles, pillars and the direction model fill in
      - run: pip install playwright && python -m playwright install --with-deps chromium && python .github/scripts/screens.py
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: shots/ }
      - name: Publish screenshots to the "screenshots" branch
        run: |
          cd shots && git init -q && git checkout -q -b screenshots
          git -c user.name=github-actions -c user.email=actions@github.com add . 
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
